plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets.main.java.srcDirs = ['src']

repositories {
    mavenCentral()
}

dependencies {
    // Starsector core (obfuscated game classes + bundled libs: lwjgl, json, ...)
    compileOnly fileTree(dir: "${starsectorPath}/starsector-core", include: '*.jar')
    // LunaLib supplies the settings page. Found wherever the mod happens to be installed.
    compileOnly fileTree(dir: "${starsectorPath}/mods", include: '**/LunaLib.jar')
}

jar {
    destinationDirectory = file('jars')
    archiveFileName = 'GamblingDen.jar'
}

// Starsector's classloader refuses java.io, java.nio.file and java.lang.reflect to mod code, and the
// refusal happens at class-resolution time - so a stray import surfaces as a crash somewhere else
// entirely. Catch it at build time instead by scanning every compiled class's constant pool.
tasks.register('checkNoForbiddenApis') {
    dependsOn tasks.named('classes')
    doLast {
        def forbidden = ['java/io/', 'java/nio/file/', 'java/lang/reflect/']
        def offenders = []
        fileTree(dir: layout.buildDirectory.dir('classes').get().asFile, include: '**/*.class').each { f ->
            def text = new String(f.bytes, 'ISO-8859-1')
            forbidden.each { needle ->
                if (text.contains(needle)) offenders << "${f.name} references ${needle}"
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Forbidden API used (Starsector will refuse to load it):\n  " +
                    offenders.join('\n  '))
        }
    }
}

tasks.named('jar') { dependsOn tasks.named('checkNoForbiddenApis') }

// Keep the supplied artwork intact; LunaLib uses the same 128px thumbnail as our other mods.
tasks.register('prepareIcon') {
    inputs.file('gambling-den-icon.png')
    outputs.file('graphics/icons/gambling-den-small.png')
    doLast {
        def original = javax.imageio.ImageIO.read(file('gambling-den-icon.png'))
        def thumbnail = new java.awt.image.BufferedImage(128, 128, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def canvas = thumbnail.createGraphics()
        try {
            canvas.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            canvas.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
                    java.awt.RenderingHints.VALUE_RENDER_QUALITY)
            double scale = Math.min(128d / original.width, 128d / original.height)
            int width = Math.round(original.width * scale) as int
            int height = Math.round(original.height * scale) as int
            canvas.drawImage(original, ((128 - width) / 2) as int, ((128 - height) / 2) as int,
                    width, height, null)
        } finally {
            canvas.dispose()
        }
        def output = file('graphics/icons/gambling-den-small.png')
        output.parentFile.mkdirs()
        javax.imageio.ImageIO.write(thumbnail, 'png', output)
    }
}

def releaseFiles = copySpec {
    from(projectDir) {
        include 'mod_info.json', 'gambling_den.version', 'README.md', 'gambling-den-icon.png'
        include 'data/**', 'graphics/**', 'jars/GamblingDen.jar'
    }
}

tasks.register('stageRelease', Copy) {
    dependsOn tasks.named('jar'), tasks.named('prepareIcon')
    with releaseFiles
    into layout.projectDirectory.dir('GamblingDen')
}

// Package directly from the source files so stale staging contents cannot enter a release.
tasks.register('releaseZip', Zip) {
    dependsOn tasks.named('stageRelease')
    destinationDirectory = layout.projectDirectory
    archiveFileName = 'GamblingDen.zip'
    into('GamblingDen') { with releaseFiles }
}
