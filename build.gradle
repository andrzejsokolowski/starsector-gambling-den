plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets.main.java.srcDirs = ['src']
sourceSets.test.java.srcDirs = ['test']

repositories {
    mavenCentral()
}

dependencies {
    // Starsector core (obfuscated game classes + bundled libs: lwjgl, json, ...)
    compileOnly fileTree(dir: "${starsectorPath}/starsector-core", include: '*.jar')
    // LunaLib supplies the settings page. Found wherever the mod happens to be installed.
    compileOnly fileTree(dir: "${starsectorPath}/mods", include: '**/LunaLib.jar')
    testImplementation files(sourceSets.main.compileClasspath)
    testImplementation fileTree(dir: "${starsectorPath}/mods", includes: ['**/LazyLib.jar', '**/Kotlin-Runtime.jar'])
}

jar {
    destinationDirectory = file('jars')
    archiveFileName = 'GamblingDen.jar'
}

// Starsector's classloader refuses java.io, java.nio.file and java.lang.reflect to mod code, and the
// refusal happens at class-resolution time - so a stray import surfaces as a crash somewhere else
// entirely. Catch it at build time instead by scanning every compiled class's constant pool.
tasks.register('checkNoForbiddenApis') {
    dependsOn tasks.named('classes')
    doLast {
        def forbidden = ['java/io/', 'java/nio/file/', 'java/lang/reflect/']
        def offenders = []
        fileTree(dir: layout.buildDirectory.dir('classes/java/main').get().asFile, include: '**/*.class').each { f ->
            def text = new String(f.bytes, 'ISO-8859-1')
            forbidden.each { needle ->
                if (text.contains(needle)) offenders << "${f.name} references ${needle}"
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Forbidden API used (Starsector will refuse to load it):\n  " +
                    offenders.join('\n  '))
        }
    }
}

tasks.named('jar') { dependsOn tasks.named('checkNoForbiddenApis') }

tasks.register('regressionTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gamblingden.tests.RegressionChecks'
    systemProperty 'org.lwjgl.librarypath', file("${starsectorPath}/starsector-core/native/windows").absolutePath
    jvmArgs '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.text=ALL-UNNAMED', '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED'
}
tasks.register('checkVersionMetadata') {
    doLast {
        def infoFile = file('mod_info.json')
        def versionFile = file('gambling_den.version')
        def registrationFile = file('data/config/version/version_files.csv')
        [infoFile, versionFile, registrationFile].each { metadata ->
            if (!metadata.isFile()) throw new GradleException("Missing update metadata: ${metadata.name}")
            if (metadata.getText('UTF-8').startsWith('\uFEFF'))
                throw new GradleException("Remove the UTF-8 BOM from ${metadata.name}")
        }
        def parser = new groovy.json.JsonSlurper()
        def info = parser.parse(infoFile, 'UTF-8')
        def remote = parser.parse(versionFile, 'UTF-8')
        def parts = ['major', 'minor', 'patch'].collect { remote.modVersion?.get(it)?.toString() }
        if (parts.any { it == null || !(it ==~ /\d+/) } || info.version != parts.join('.'))
            throw new GradleException('mod_info.json and gambling_den.version must have the same numeric version')
        def masterUrl = 'https://raw.githubusercontent.com/andrzejsokolowski/starsector-gambling-den/main/gambling_den.version'
        def downloadUrl = 'https://github.com/andrzejsokolowski/starsector-gambling-den/releases/latest/download/GamblingDen.zip'
        if (info.id != 'gambling_den' || info.name != remote.modName)
            throw new GradleException('Update metadata must identify Gambling Den')
        if (info.updateCheckURL != masterUrl || remote.masterVersionFile != masterUrl)
            throw new GradleException('Both update URLs must point to the published gambling_den.version file')
        if (remote.directDownloadURL != downloadUrl)
            throw new GradleException('The update download must point to the GamblingDen.zip release asset')
        if (info.modThreadId?.toString() != '35993' || remote.modThreadId?.toString() != '35993')
            throw new GradleException('Both metadata files must link to forum topic 35993')
        if (info.gameVersion != remote.starsectorVersion)
            throw new GradleException('The supported Starsector versions do not match')
        if (registrationFile.readLines('UTF-8').findAll { !it.trim().isEmpty() } != ['version file', 'gambling_den.version'])
            throw new GradleException('Version Checker must register gambling_den.version')
        logger.lifecycle("Update metadata verified for Gambling Den ${info.version}")
    }
}
tasks.named('check') { dependsOn tasks.named('regressionTest'), tasks.named('checkNoForbiddenApis'), tasks.named('checkVersionMetadata') }
// These checks use a standalone game-API harness, not a JUnit engine.
tasks.named('test') { enabled = false }

// Keep the supplied artwork intact; LunaLib uses the same 128px thumbnail as our other mods.
tasks.register('prepareIcon') {
    inputs.file('gambling-den-icon.png')
    outputs.file('graphics/icons/gambling-den-small.png')
    doLast {
        def original = javax.imageio.ImageIO.read(file('gambling-den-icon.png'))
        def thumbnail = new java.awt.image.BufferedImage(128, 128, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def canvas = thumbnail.createGraphics()
        try {
            canvas.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            canvas.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
                    java.awt.RenderingHints.VALUE_RENDER_QUALITY)
            double scale = Math.min(128d / original.width, 128d / original.height)
            int width = Math.round(original.width * scale) as int
            int height = Math.round(original.height * scale) as int
            canvas.drawImage(original, ((128 - width) / 2) as int, ((128 - height) / 2) as int,
                    width, height, null)
        } finally {
            canvas.dispose()
        }
        def output = file('graphics/icons/gambling-den-small.png')
        output.parentFile.mkdirs()
        javax.imageio.ImageIO.write(thumbnail, 'png', output)
    }
}

def releaseFiles = copySpec {
    from(projectDir) {
        include 'mod_info.json', 'gambling_den.version', 'README.md', 'gambling-den-icon.png'
        include 'THIRD_PARTY_NOTICES.txt', 'licenses/**'
        include 'data/**', 'graphics/**', 'jars/GamblingDen.jar'
    }
}

tasks.register('stageRelease', Copy) {
    dependsOn tasks.named('jar'), tasks.named('prepareIcon')
    with releaseFiles
    into layout.projectDirectory.dir('GamblingDen')
}

// Package directly from the source files so stale staging contents cannot enter a release.
tasks.register('releaseZip', Zip) {
    dependsOn tasks.named('stageRelease'), tasks.named('check')
    destinationDirectory = layout.projectDirectory
    archiveFileName = 'GamblingDen.zip'
    into('GamblingDen') { with releaseFiles }
}
